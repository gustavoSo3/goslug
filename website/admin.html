<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="/public/favicon.jpg">
    <title>Admin</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Admin Console</h1>
        <img src="public/profile.jpg" alt="Profile Image" width="100px">    
    </header>
    
    <div>
        <div id="create-redirect-form">
            <div>
                <label for="new-description">Description</label>
                <input type="text" id="new-description" placeholder="Enter Redirect Description"></input>
            </div>
            <div>
                <label for="new-slug">Slug /</label>
                <input type="text" id="new-slug" placeholder="Enter Slug"></input>
            </div>
            <div>
                <label for="new-destination">Destination URL</label>
                <input type="url" id="new-destination" placeholder="Enter Destination URL"></input>
            </div>
            <button id="submit-new-redirect">Add Redirect</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Slug</th>
                <th>Destination</th>
            </tr>
        </thead>
        <tbody id="redirects-table-body">
            {{range .Redirects}}
            <tr>
                <td>{{.Description}}</td>
                <td><a href="{{.Slug}}"><span style="color: gray;">{{$.Host}}</span>{{.Slug}}</a></td>
                <td><a href="{{.Destination}}">{{.Destination}}</a></td>
                <td><button onclick="deleteRedirect('{{.Slug}}')">delete</button></td>
            </tr>
            {{end}}
        </tbody>

    </table>

    <script src="/public/scripts/index.js"></script>
</body>
</html>
