<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="/public/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <title>GoSlug</title>

</head>
<body>
    <header class="container my-3 mb-10">
        <div class="d-flex justify-content-between align-items-center">
            
            <!-- Left Side: Logo + Title -->
            <div class="d-flex align-items-center gap-3">
                <img src="public/favicon.svg" alt="url-redirect Logo" width="50" height="50">
                <h1 class="h3 mb-0">GoSlug Admin Console</h1>
            </div>

            <div>
                    
                <button id="color-mode-toggle" class="btn-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sun" viewBox="0 0 16 16">
                        <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
                    </svg>
                    /
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-fill" viewBox="0 0 16 16">
                        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
                    </svg>
                </button>
                <!-- Right Side: Profile Image -->
                <a href="#" class="d-inline-block">
                    <img src="public/profile.jpg" alt="Profile Image" class="rounded-circle" width="45" height="45" style="object-fit: cover;">
                </a>

            </div>
        </div>
    </header>


    
    <!-- New Slug Input Form -->
    <div class="container mb-10">
        <div class="d-flex flex-column justify-content-evenly align-items-center gap-3 ">
            <div id="create-redirect-form" class="d-flex flex-column justify-content-evenly align-items-center gap-3 xl:flex-row w-100">

                <div class="input-group ">
                    <label for="new-description" class="input-group-text">Description</label>
                    <input type="text" id="new-description" placeholder="e.g., To Google" class="form-control"></input>
                </div>
                
                <div class="input-group">
                    <label for="new-slug" class="input-group-text">Slug /</label>
                    <input type="text" id="new-slug" placeholder="e.g., ggl" class="form-control"></input>
                </div>
                
                <div class="input-group">
                    <label for="new-destination" class="input-group-text">Destination URL</label>
                    <input type="url" id="new-destination" placeholder="e.g., https://google.com" class="form-control"></input>
                </div>
            </div>
            <button id="submit-new-redirect" class="theme-primary btn-solid w-100">Add Redirect</button>
        </div>
    </div>

    <div class="container d-none md:d-block">
        <table class="table">
            <thead>
                <tr >
                    <th scope="col">Description</th>
                    <th scope="col">Slug</th>
                    <th scope="col">Destination</th>
                    <th scope="col">Delete Redirect</th>
                </tr>
            </thead>
            <tbody id="redirects-table-body">
                {{range .Redirects}}
                <tr>
                    <td><a href="{{.Slug}}">{{.Slug}}</a></td>
                    <td><a href="{{.Destination}}">{{.Destination}}</a></td>
                    <td>{{.Description}}</td>
                    <td><button onclick="deleteRedirect('{{.Slug}}')" class="theme-danger btn-outline">delete</button></td>
                </tr>
                {{end}}
            </tbody>

        </table>
    </div>

    <div class="container d-flex flex-column justify-content-start align-items-center md:d-none gap-3">

        {{range .Redirects}}
        
        <div class="w-100 d-flex justify-content-between align-items-center border rounded-5 overflow-hidden">
            <div class="p-5 text-break overflow-hidden">
                <div class="h3">
                    <a href="{{.Slug}}">{{.Slug}}</a>
                </div>
                <div class="text-break">
                    <a href="{{.Destination}}">{{.Destination}}</a>
                </div>
                <p class="mb-0">
                    {{.Description}}
                </p>
            </div>
            <div class="p-5 flex-shrink-0">
                <button onclick="deleteRedirect('{{.Slug}}')" class="theme-danger btn-outline">delete</button>
            </div>
        </div>

        {{end}}

    </div>

    <script src="/public/scripts/index.js"></script>
</body>
</html>
